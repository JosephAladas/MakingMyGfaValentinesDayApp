<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=650, initial-scale=1.0">
    <title>Valentine</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="window">
        <header>
            <div class="title-bar">
                <div class="window-controls">
                    <img src="../assets/close.png" alt="close" class="close">
                    <img src="../assets/shrink.png" alt="shrink" class="minimize">
                </div>
            </div>
        </header>

        <!-- Clouds should be behind content -->
        <div class="clouds"></div>

        <div class="content">
            <p class="text">WILL YOU BE MY <br> VALENTINE?</p>
            <div class="graphics">
                <img src="../assets/me.png" alt="Face" class="face">
                <img src="../assets/heart1.png" alt="Heart" class="heart">
            </div>
            <button class="accept-btn">
                <img src="../assets/accept.png" alt="Accept?"/>
            </button>
        </div>
    </div>
</body>
</html>
